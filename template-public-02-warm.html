<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板 B · 温暖极简 · 爱心宠物领养平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #faf7f2; color: #3d3a35;
    min-height: 100vh;
  }
  .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* 顶栏 */
  header { border-bottom: 1px solid #efe9df; background: rgba(250,247,242,.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
  .nav { max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 800; font-size: 21px; color: #2f2b26; letter-spacing: 1px; }
  .brand i { color: #e8927c; font-style: normal; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-right a { color: #7a736a; font-size: 14px; text-decoration: none; font-weight: 600; }
  .nav-right a:hover { color: #e8927c; }
  .btn { border: none; cursor: pointer; font-weight: 700; border-radius: 999px; padding: 10px 24px; font-size: 14px; transition: all .2s; }
  .btn-primary { background: #e8927c; color: #fff; box-shadow: 0 6px 16px rgba(232,146,124,.35); }
  .btn-primary:hover { background: #dd7f66; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1.5px solid #e0d8cb; color: #6b645b; }
  .btn-outline:hover { border-color: #e8927c; color: #e8927c; }

  /* Hero - 手绘感 */
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 40px; padding: 60px 0 28px; }
  .hero h1 { font-size: 46px; line-height: 1.2; font-weight: 900; color: #2f2b26; letter-spacing: 1px; }
  .hero h1 em { font-style: normal; color: #e8927c; position: relative; }
  .hero h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 10px; background: rgba(232,146,124,.25); z-index: -1; border-radius: 4px; }
  .hero p { margin: 18px 0 26px; color: #8a837a; font-size: 16px; line-height: 1.8; }
  .hero .hero-btns { display: flex; gap: 14px; }
  .hero .hero-note { margin-top: 18px; font-size: 13px; color: #b0a99e; }
  .hero-visual { position: relative; height: 320px; }
  .hero-visual .circle {
    position: absolute; border-radius: 50%; display: grid; place-items: center; font-size: 54px;
    box-shadow: 0 18px 40px rgba(90,80,70,.12); transition: transform .3s;
  }
  .hero-visual .circle:hover { transform: scale(1.06) rotate(-4deg); }
  .cv1 { width: 170px; height: 170px; background: #ffe9de; top: 0; left: 0; }
  .cv2 { width: 130px; height: 130px; background: #e6f4e9; top: 8px; right: 10px; font-size: 44px; }
  .cv3 { width: 150px; height: 150px; background: #fff3d6; bottom: 0; left: 90px; }
  .hero-visual .float-note {
    position: absolute; bottom: 6px; right: 0; background: #fff; border-radius: 16px;
    padding: 10px 16px; font-size: 13px; font-weight: 700; color: #6b645b;
    box-shadow: 0 8px 20px rgba(90,80,70,.1);
  }

  /* 分类 */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 18px; }
  .section-head h2 { font-size: 26px; font-weight: 900; color: #2f2b26; }
  .section-head h2 span { color: #e8927c; }
  .section-head a { font-size: 14px; color: #a49c91; text-decoration: none; font-weight: 600; }
  .cats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .cat {
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #fff; border: 1.5px solid #ece5da; color: #8a837a; transition: all .2s;
  }
  .cat.active { background: #2f2b26; color: #fff; border-color: #2f2b26; }
  .cat:hover:not(.active) { border-color: #e8927c; color: #e8927c; }

  /* 卡片 - 圆润柔和 */
  .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 22px; }
  @media (max-width:1000px){ .grid{ grid-template-columns: repeat(3,1fr);} }
  @media (max-width:760px){ .grid{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr;} }
  .card {
    background: #fff; border-radius: 24px; overflow: hidden; cursor: pointer; position: relative;
    border: 1px solid #f0eae0; transition: transform .25s, box-shadow .25s;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 18px 36px rgba(90,80,70,.12); }
  .card .thumb { height: 200px; display: grid; place-items: center; font-size: 80px; position: relative; }
  .card .thumb .gender {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 14px; color: #fff; background: rgba(255,255,255,.3);
    backdrop-filter: blur(6px); font-weight: 700;
  }
  .card .body { padding: 16px 18px 20px; }
  .card .row { display: flex; justify-content: space-between; align-items: center; }
  .card .name { font-size: 18px; font-weight: 800; color: #2f2b26; }
  .card .avail {
    font-size: 11px; font-weight: 700; color: #16a34a; background: #e6f6ea; padding: 4px 10px; border-radius: 999px;
  }
  .card .meta { margin: 8px 0 6px; font-size: 13px; color: #a49c91; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .desc { font-size: 13px; color: #7a736a; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 44px; }
  .card .cta { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #ece5da; text-align: center; }
  .card .cta .btn { width: 100%; padding: 10px 0; }

  /* 标语横幅 */
  .banner {
    margin: 46px 0; padding: 34px 40px; border-radius: 26px; background: #2f2b26; color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .banner h3 { font-size: 22px; font-weight: 800; }
  .banner p { color: #c8c0b4; font-size: 14px; margin-top: 6px; }
  .banner .btn-primary { background: #fff; color: #2f2b26; box-shadow: none; }
  .banner .btn-primary:hover { background: #ffe9de; }

  footer { text-align: center; padding: 30px 0 40px; color: #b0a99e; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">🐾 爱心<i>领养</i></div>
      <div class="nav-right">
        <a href="#">成功故事</a>
        <a href="#">救助站动态</a>
        <button class="btn btn-outline">登录</button>
        <button class="btn btn-primary">成为志愿者</button>
      </div>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <div>
        <h1>遇见你，<br>是它们<em>一生</em>的幸运</h1>
        <p>这里有被救助的毛孩子们，正翘首以盼一个温暖的家。领养代替购买，让爱不再流浪。</p>
        <div class="hero-btns">
          <button class="btn btn-primary">浏览待领养 →</button>
          <button class="btn btn-outline">了解领养流程</button>
        </div>
        <div class="hero-note">🏠 已帮助 356 只宠物找到新家 · 实名认证 · 定期回访</div>
      </div>
      <div class="hero-visual">
        <div class="circle cv1">🐱</div>
        <div class="circle cv2">🐰</div>
        <div class="circle cv3">🐶</div>
        <div class="float-note">❤ 本月新增 18 只待领养</div>
      </div>
    </section>

    <div class="section-head">
      <h2>等待领养的<span>毛孩子</span></h2>
      <a href="#">查看全部 →</a>
    </div>

    <div class="cats">
      <button class="cat active">全部</button>
      <button class="cat">🐱 猫咪</button>
      <button class="cat">🐶 狗狗</button>
      <button class="cat">🐰 兔兔</button>
      <button class="cat">🐹 其他</button>
    </div>

    <main class="grid" id="grid"></main>

    <section class="banner">
      <div>
        <h3>想贡献一份力量？</h3>
        <p>每月开放志愿者名额，陪毛孩子散步、喂食、洗澡，让它们感受人类的温暖。</p>
      </div>
      <button class="btn btn-primary">申请成为志愿者</button>
    </section>

    <footer>© 2026 爱心宠物领养平台 · 用爱终结流浪</footer>
  </div>

<script>
  const pets = [
    { name: "糯米", breed: "英短蓝猫", age: 6, gender: "1", weight: 3.8, desc: "性格温顺黏人，喜欢被摸下巴，已打完疫苗驱虫。", bg: "#eef2ff", emoji: "🐱" },
    { name: "旺财", breed: "金毛寻回犬", age: 14, gender: "1", weight: 22.5, desc: "阳光大暖男，服从性高，适合有院子的家庭。", bg: "#fff6e0", emoji: "🐶" },
    { name: "雪球", breed: "布偶猫", age: 9, gender: "0", weight: 4.2, desc: "安静优雅的小公主，蓝眼睛超治愈。", bg: "#f0f7ff", emoji: "🐱" },
    { name: "来福", breed: "中华田园犬", age: 8, gender: "1", weight: 12.0, desc: "机灵护主，看家一把好手，亲人爱撒娇。", bg: "#ffeef1", emoji: "🐶" },
    { name: "布丁", breed: "垂耳兔", age: 5, gender: "0", weight: 1.6, desc: "软乎乎的小团子，爱吃胡萝卜，安静不吵闹。", bg: "#fdf2f8", emoji: "🐰" },
    { name: "黑豆", breed: "德文卷毛猫", age: 12, gender: "1", weight: 3.1, desc: "活泼爱玩，掉毛极少，适合对毛过敏的你。", bg: "#f1f5f9", emoji: "🐱" },
    { name: "花卷", breed: "柯基犬", age: 16, gender: "0", weight: 10.4, desc: "小短腿大能量，治愈系笑容，精力旺盛。", bg: "#fffbe6", emoji: "🐶" },
    { name: "球球", breed: "金丝熊仓鼠", age: 4, gender: "1", weight: 0.12, desc: "自带仓鼠轮，夜里跑酷选手，好养活。", bg: "#fff0ec", emoji: "🐹" }
  ];
  const grid = document.getElementById('grid');
  grid.innerHTML = pets.map(p => `
    <div class="card">
      <div class="thumb" style="background:${p.bg}">${p.emoji}<span class="gender">${p.gender === '1' ? '♂' : '♀'}</span></div>
      <div class="body">
        <div class="row"><span class="name">${p.name}</span><span class="avail">● 可领养</span></div>
        <div class="meta"><span>${p.breed}</span>·<span>${p.age}个月</span>·<span>${p.weight}kg</span></div>
        <div class="desc">${p.desc}</div>
        <div class="cta"><button class="btn btn-primary">申请领养</button></div>
      </div>
    </div>`).join('');
  document.querySelectorAll('.cat').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  }));
</script>
</body>
</html>
