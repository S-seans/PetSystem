<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板 C · 深色高级 · 爱心宠物领养平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

  /* 顶部导航 */
  header { position: sticky; top: 0; z-index: 50; background: rgba(13,17,23,.82); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.06); }
  .nav { max-width: 1180px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 800; letter-spacing: 1px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg,#22d3ee,#a78bfa); font-size: 19px;
    box-shadow: 0 0 24px rgba(34,211,238,.4);
  }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: #9aa4b2; }
  .nav-links a { text-decoration: none; color: inherit; font-weight: 600; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: #22d3ee; }
  .btn { border: none; cursor: pointer; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 11px 22px; transition: all .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: linear-gradient(135deg,#22d3ee,#6366f1); color: #04121f; box-shadow: 0 8px 24px rgba(34,211,238,.3); }
  .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.14); color: #e6edf3; }
  .btn-ghost:hover { border-color: #22d3ee; color: #22d3ee; }

  /* Hero */
  .hero { text-align: center; padding: 72px 0 20px; position: relative; }
  .hero::before {
    content: ""; position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 320px; background: radial-gradient(closest-side, rgba(34,211,238,.22), transparent); z-index: -1;
  }
  .hero .badge { display: inline-block; font-size: 12px; letter-spacing: 2px; color: #22d3ee; border: 1px solid rgba(34,211,238,.4); border-radius: 999px; padding: 6px 16px; margin-bottom: 20px; }
  .hero h1 { font-size: 48px; font-weight: 900; letter-spacing: 1px; line-height: 1.15; }
  .hero h1 span { background: linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 18px auto 30px; color: #8b95a5; font-size: 16px; max-width: 560px; line-height: 1.8; }
  .hero .stats { display: flex; gap: 56px; justify-content: center; margin-top: 34px; }
  .hero .stat b { font-size: 30px; font-weight: 900; background: linear-gradient(90deg,#22d3ee,#a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .stat span { display: block; margin-top: 4px; font-size: 13px; color: #7a8494; }

  /* 分类 */
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 46px 0 22px; }
  .bar h2 { font-size: 24px; font-weight: 800; }
  .bar .count { font-size: 14px; color: #7a8494; }
  .cats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .cat {
    padding: 9px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    background: #161c26; border: 1px solid #212a36; color: #9aa4b2; transition: all .2s;
  }
  .cat.active { background: linear-gradient(135deg,#22d3ee,#6366f1); color: #04121f; border-color: transparent; }
  .cat:hover:not(.active) { border-color: #22d3ee; color: #22d3ee; }

  /* 卡片 */
  .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 22px; }
  @media (max-width:1000px){ .grid{ grid-template-columns: repeat(3,1fr);} }
  @media (max-width:760px){ .grid{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width:480px){ .grid{ grid-template-columns:1fr;} }
  .card {
    background: #151b24; border-radius: 20px; overflow: hidden; cursor: pointer;
    border: 1px solid #212a36; transition: transform .25s, border-color .25s, box-shadow .25s;
  }
  .card:hover { transform: translateY(-6px); border-color: rgba(34,211,238,.5); box-shadow: 0 16px 36px rgba(0,0,0,.5); }
  .card .thumb { height: 200px; display: grid; place-items: center; font-size: 84px; position: relative; }
  .card .thumb .avail {
    position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 700; color: #22d3ee;
    background: rgba(13,17,23,.7); border: 1px solid rgba(34,211,238,.4); padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .card .thumb .gender {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; background: rgba(13,17,23,.7); backdrop-filter: blur(6px);
  }
  .card .body { padding: 16px 18px 20px; }
  .card .name { font-size: 18px; font-weight: 800; }
  .card .meta { margin: 8px 0; font-size: 13px; color: #7a8494; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .meta b { color: #aab4c2; font-weight: 600; }
  .card .desc { font-size: 13px; color: #8b95a5; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 44px; }
  .card .foot { display: flex; gap: 10px; margin-top: 14px; }
  .card .foot .btn { flex: 1; padding: 10px 0; font-size: 13px; text-align: center; }

  footer { text-align: center; padding: 46px 0 40px; color: #5c6675; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand"><span class="logo">🐾</span>PAW·领养</div>
      <div class="nav-links">
        <a href="#" class="active">首页</a>
        <a href="#">待领养</a>
        <a href="#">成功故事</a>
        <a href="#">数据看板</a>
      </div>
      <div class="nav-right">
        <button class="btn btn-ghost">登录</button>
        <button class="btn btn-primary">注册</button>
      </div>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <span class="badge">ADOPT · DON'T SHOP</span>
      <h1>给流浪的生命，<br>一个<span>被爱的可能</span></h1>
      <p>每一双清澈的眼睛背后，都藏着一个渴望被拥抱的灵魂。加入我们，用领养点亮它们的世界。</p>
      <button class="btn btn-primary" style="padding:13px 34px;">开始浏览 →</button>
      <div class="stats">
        <div class="stat"><b>128</b><span>等待领养</span></div>
        <div class="stat"><b>356</b><span>已经领养</span></div>
        <div class="stat"><b>42</b><span>志愿者</span></div>
      </div>
    </section>

    <div class="bar">
      <h2>待领养宠物</h2>
      <span class="count">共 128 只小可爱</span>
    </div>
    <div class="cats">
      <button class="cat active">全部</button>
      <button class="cat">🐱 猫咪</button>
      <button class="cat">🐶 狗狗</button>
      <button class="cat">🐰 兔兔</button>
    </div>

    <main class="grid" id="grid"></main>

    <footer>© 2026 PAW·领养平台 · 让爱不再流浪</footer>
  </div>

<script>
  const pets = [
    { name: "糯米", breed: "英短蓝猫", age: 6, gender: "1", weight: 3.8, desc: "性格温顺黏人，喜欢被摸下巴，已打完疫苗驱虫。", bg: "linear-gradient(135deg,#1e2a3a,#24304a)", emoji: "🐱" },
    { name: "旺财", breed: "金毛寻回犬", age: 14, gender: "1", weight: 22.5, desc: "阳光大暖男，服从性高，适合有院子的家庭。", bg: "linear-gradient(135deg,#3a2f1e,#4a3a24)", emoji: "🐶" },
    { name: "雪球", breed: "布偶猫", age: 9, gender: "0", weight: 4.2, desc: "安静优雅的小公主，蓝眼睛超治愈。", bg: "linear-gradient(135deg,#1e2a3a,#2a3a52)", emoji: "🐱" },
    { name: "来福", breed: "中华田园犬", age: 8, gender: "1", weight: 12.0, desc: "机灵护主，看家一把好手，亲人爱撒娇。", bg: "linear-gradient(135deg,#3a1e24,#4a2430)", emoji: "🐶" },
    { name: "布丁", breed: "垂耳兔", age: 5, gender: "0", weight: 1.6, desc: "软乎乎的小团子，爱吃胡萝卜，安静不吵闹。", bg: "linear-gradient(135deg,#2a1e3a,#3a244a)", emoji: "🐰" },
    { name: "黑豆", breed: "德文卷毛猫", age: 12, gender: "1", weight: 3.1, desc: "活泼爱玩，掉毛极少，适合对毛过敏的你。", bg: "linear-gradient(135deg,#1e1e24,#2a2a34)", emoji: "🐱" },
    { name: "花卷", breed: "柯基犬", age: 16, gender: "0", weight: 10.4, desc: "小短腿大能量，治愈系笑容，精力旺盛。", bg: "linear-gradient(135deg,#3a2e1e,#4a3a24)", emoji: "🐶" },
    { name: "球球", breed: "金丝熊仓鼠", age: 4, gender: "1", weight: 0.12, desc: "自带仓鼠轮，夜里跑酷选手，好养活。", bg: "linear-gradient(135deg,#3a1e1e,#4a2424)", emoji: "🐹" }
  ];
  const grid = document.getElementById('grid');
  grid.innerHTML = pets.map(p => `
    <div class="card">
      <div class="thumb" style="background:${p.bg}">${p.emoji}
        <span class="avail">● 可领养</span>
        <span class="gender" style="color:${p.gender === '1' ? '#22d3ee' : '#f472b6'}">${p.gender === '1' ? '♂' : '♀'}</span>
      </div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="meta"><b>${p.breed}</b><span>·</span><span>${p.age}个月</span><span>·</span><span>${p.weight}kg</span></div>
        <div class="desc">${p.desc}</div>
        <div class="foot">
          <button class="btn btn-primary">领养它</button>
          <button class="btn btn-ghost">详情</button>
        </div>
      </div>
    </div>`).join('');
  document.querySelectorAll('.cat').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.cat').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  }));
</script>
</body>
</html>
